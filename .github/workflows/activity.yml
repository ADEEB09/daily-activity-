name: Daily GitHub Activity Bot

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST
    - cron: '0 9 * * *'    # 2:30 PM IST
    - cron: '30 12 * * *'  # 6:00 PM IST
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "iakashmall"
          git config user.email "akash.mall.mac@gmail.com"

      - name: Make randomized commits
        run: |
          python3 << 'EOF'
          import subprocess
          import random
          import os
          from datetime import datetime, date

          messages = [
            "fix: resolve minor bug in logic",
            "chore: update dependencies",
            "refactor: clean up unused code",
            "docs: improve readme clarity",
            "feat: add minor utility function",
            "style: format code consistently",
            "test: update test descriptions",
            "perf: optimize loop performance",
            "chore: sync daily log",
            "fix: correct typo in comments",
          ]

          event = os.environ.get("GITHUB_EVENT_NAME", "schedule")
          is_manual = event == "workflow_dispatch"

          # Skip weekends randomly (30% chance) — real devs rest too
          today = date.today().weekday()  # 5=Sat, 6=Sun
          is_weekend = today in [5, 6]

          if is_weekend and random.random() < 0.30 and not is_manual:
            print("⏭️ Weekend skip — taking a rest like a human!")
            exit(0)

          # Vary commits naturally:
          # Manual = always 1-2 commits
          # Scheduled = 60% chance of 1 commit, 30% chance of 2, 10% skip
          if is_manual:
            num_commits = random.randint(1, 2)
          else:
            roll = random.random()
            if roll < 0.10:
              num_commits = 0   # 10% skip
            elif roll < 0.70:
              num_commits = 1   # 60% chance of 1 commit
            else:
              num_commits = 2   # 30% chance of 2 commits

          print(f"Event: {event} | Commits planned: {num_commits}")

          for i in range(num_commits):
            msg = random.choice(messages)
            timestamp = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

            with open("daily_log.txt", "a") as f:
              f.write(f"{timestamp} — {msg}\n")

            subprocess.run(["git", "add", "daily_log.txt"])
            subprocess.run(["git", "commit", "-m", msg])

          if num_commits > 0:
            subprocess.run(["git", "push"])
            print(f"✅ Pushed {num_commits} commit(s)")
          else:
            print("⏭️ Skipped this scheduled run")
          EOF
